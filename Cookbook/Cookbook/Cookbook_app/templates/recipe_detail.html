<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>{{recipe.title}}</title>
    <link rel="stylesheet" href="{% static 'styling.css' %}" media="screen">
</head>
<body class="app-page">
<div class="app-shell">
    <aside class="app-sidebar">
        <h2>Książka kucharska</h2>
        <nav class="sidebar-menu" aria-label="Menu główne">
            <a class="menu-button" href="{% url 'home' %}">Strona główna</a>
            {% if user.is_authenticated %}
                <a class="menu-button" href="{% url 'favorites' %}">Ulubione</a>
                <a class="menu-button" href="{% url 'shopping_list' %}">Lista zakupów</a>
                <a class="menu-button" href="{% url 'logout' %}">Wyloguj</a>
            {% else %}
                <a class="menu-button" href="{% url 'login' %}">Zaloguj</a>
                <a class="menu-button" href="{% url 'register' %}">Utwórz konto</a>
            {% endif %}
        </nav>
    </aside>

    <main class="main-panel">
        <header class="page-header">
            <img class="hero" src="{% static 'gotowanie.jpg' %}" alt="Cooking">
            <h1>{{recipe.title}}</h1>
        </header>

        {% if user.is_authenticated %}
            <div class="recipe-actions">
                <form method="post" action="{% url 'toggle_favorite' recipe.file %}" class="inline-form">
                    {% csrf_token %}
                    <button type="submit" class="favorite-button">
                        {% if is_favorite %}Usuń z ulubionych{% else %}Dodaj do ulubionych{% endif %}
                    </button>
                </form>
                <form method="post" action="{% url 'shopping_list_add_recipe' %}" class="inline-form">
                    {% csrf_token %}
                    <input type="hidden" name="recipe_id" value="{{ recipe.id }}">
                    <button type="submit" class="favorite-button accent-button">Dodaj składniki do listy</button>
                </form>
            </div>
        {% endif %}

        <div class="recipe-content">{{recipe.content|safe}}</div>
    </main>
</div>
</body>
</html>
