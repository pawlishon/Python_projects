<!DOCTYPE html>
<html>
{% load static %}
<head>
    <meta charset="utf-8">
    <title>Reset hasła</title>
    <link rel="stylesheet" href="{% static 'styling.css' %}">
</head>
<body>
<h1>Reset hasła</h1>
<p>Wpisz swój adres e-mail, aby otrzymać link do zresetowania hasła.</p>
<form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }} {{ form.email }}
    <button type="submit">Wyślij</button>
</form>
</body>
</html>
